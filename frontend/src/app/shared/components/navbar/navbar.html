<nav class="navbar">
  <div class="navbar__container">

    <!-- LOGO -->
    <a routerLink="/" class="navbar__logo">
      <span class="navbar__logo-icon">🍫</span>
      <span class="navbar__logo-text">Chocolate Shop</span>
    </a>

    <!-- MENU DESKTOP -->
    <ul class="navbar__links" [class.open]="isMenuOpen()">
      <li>
        <a routerLink="/catalog" routerLinkActive="active">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
          {{ t('catalog') }}
        </a>
      </li>
      <li>
        <a routerLink="/cart" routerLinkActive="active">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          {{ t('cart') }}
          <span class="badge" *ngIf="cartCount() > 0">{{ cartCount() }}</span>
        </a>
      </li>
      <li>
        <a routerLink="/orders" routerLinkActive="active">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          {{ t('orders') }}
        </a>
      </li>
      <li>
        <a routerLink="/stock" routerLinkActive="active">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
          {{ t('stock') }}
        </a>
      </li>
    </ul>

    <!-- ACÇÕES -->
    <div class="navbar__actions">

      <!-- Toggle Idioma -->
      <button class="icon-btn lang-btn" (click)="toggleLang()">
        {{ currentLang() === 'pt' ? 'EN' : 'PT' }}
      </button>

      <!-- Toggle Tema -->
      <button class="icon-btn" (click)="toggleTheme()">
        <svg *ngIf="!isDarkTheme()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg *ngIf="isDarkTheme()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
      </button>

      <!-- Login -->
      <a routerLink="/auth/login" class="btn-login">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        {{ t('login') }}
      </a>

      <!-- Menu Mobile -->
      <button class="icon-btn menu-toggle" (click)="toggleMenu()">
        <svg *ngIf="!isMenuOpen()" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        <svg *ngIf="isMenuOpen()" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>

    </div>
  </div>
</nav>
