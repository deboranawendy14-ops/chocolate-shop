<nav class="navbar">
  <div class="navbar__container">

    <!-- LOGO -->
    <a routerLink="/" class="navbar__logo">
      Chocolate Shop
    </a>

    <!-- MENU -->
    <ul class="navbar__links" [class.open]="isMenuOpen()">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">{{ t('home') }}</a></li>
      <li><a routerLink="/catalog" routerLinkActive="active">{{ t('catalog') }}</a></li>
      <li *ngIf="authService.isLoggedIn()"><a routerLink="/orders" routerLinkActive="active">{{ t('orders') }}</a></li>
      <li *ngIf="authService.isAdmin()"><a routerLink="/stock" routerLinkActive="active">{{ t('stock') }}</a></li>
    </ul>

    <!-- ACÇÕES -->
    <div class="navbar__actions">

      <!-- Toggle Tema -->
      <button class="icon-btn" (click)="toggleTheme()" title="Alternar tema">
        <svg *ngIf="!isDarkTheme()" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg *ngIf="isDarkTheme()" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
      </button>

      <!-- Toggle Idioma -->
      <button class="icon-btn lang-btn" (click)="toggleLang()" title="Mudar idioma">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253M3 12a8.96 8.96 0 00.284 2.253"/></svg>
        {{ currentLang() === 'pt' ? 'PT' : 'EN' }}
      </button>

      <!-- Carrinho -->
      <a routerLink="/cart" class="icon-btn" title="Carrinho">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span class="cart-count" *ngIf="cartService.cartCount() > 0">{{ cartService.cartCount() }}</span>
      </a>

      <!-- Se não está autenticado -->
      <ng-container *ngIf="!authService.isLoggedIn()">
        <a routerLink="/auth/login" class="btn-login">{{ t('login') }}</a>
        <a routerLink="/auth/register" class="btn-register">{{ t('register') }}</a>
      </ng-container>

      <!-- Se está autenticado -->
      <ng-container *ngIf="authService.isLoggedIn()">
        <a routerLink="/profile" class="navbar__username">{{ authService.currentUser()?.name }}</a>
        <button class="btn-login" (click)="logout()">{{ t('logout') }}</button>
      </ng-container>

      <!-- Mobile -->
      <button class="icon-btn menu-toggle" (click)="toggleMenu()" title="Menu">
        <svg *ngIf="!isMenuOpen()" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        <svg *ngIf="isMenuOpen()" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>

    </div>
  </div>
</nav>
