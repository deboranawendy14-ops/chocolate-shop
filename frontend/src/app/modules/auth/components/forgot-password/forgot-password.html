<div class="auth-page">
  <div class="auth-card">

    <div class="auth-card__header">
      <a routerLink="/" class="auth-card__logo">Chocolate Shop</a>
      <h2>Recuperar Password</h2>
      <p>Introduza o seu email para receber as instruções</p>
    </div>

    <!-- SUCESSO -->
    <div class="auth-success" *ngIf="success()">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <p>Se o email existir, receberá as instruções em breve.</p>
      <a routerLink="/auth/login" class="btn-submit" style="display:block; text-align:center; margin-top:16px;">Voltar ao Login</a>
    </div>

    <div class="auth-card__body" *ngIf="!success()">

      <div class="auth-card__error" *ngIf="error()">
        {{ error() }}
      </div>

      <div class="form-group">
        <label>Email</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/></svg>
          <input type="email" [(ngModel)]="email" placeholder="seu@email.com" />
        </div>
      </div>

      <button class="btn-submit" (click)="onSubmit()" [disabled]="isLoading()">
        <span *ngIf="!isLoading()">Enviar Instruções</span>
        <span *ngIf="isLoading()">A enviar...</span>
      </button>

      <p class="auth-card__switch">
        <a routerLink="/auth/login">← Voltar ao Login</a>
      </p>

    </div>
  </div>
</div>
