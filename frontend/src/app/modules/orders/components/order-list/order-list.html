<div class="orders-page">
  <div class="orders-page__container">

    <h1 class="orders-page__title">Os Meus Pedidos</h1>

    <!-- LOADING -->
    <div class="orders-loading" *ngIf="isLoading()">
      <p>A carregar pedidos...</p>
    </div>

    <!-- ERRO -->
    <div class="orders-error" *ngIf="error()">
      <p>{{ error() }}</p>
      <a routerLink="/auth/login" class="btn-primary" *ngIf="!authService.isLoggedIn()">Entrar na conta</a>
    </div>

    <!-- VAZIO -->
    <div class="orders-empty" *ngIf="!isLoading() && !error() && orders().length === 0">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      <h2>Ainda não tem pedidos</h2>
      <p>Faça a sua primeira compra!</p>
      <a routerLink="/catalog" class="btn-primary">Ver Produtos</a>
    </div>

    <!-- LISTA -->
    <div class="orders-list" *ngIf="!isLoading() && !error() && orders().length > 0">
      <div class="order-card" *ngFor="let order of orders()">
        <div class="order-card__header">
          <div>
            <span class="order-card__id">Pedido #{{ order.id }}</span>
            <span class="order-card__date">{{ order.created_at | date:'dd/MM/yyyy HH:mm' }}</span>
          </div>
          <span class="order-card__status" [class]="getStatusClass(order.status)">
            {{ getStatusLabel(order.status) }}
          </span>
        </div>
        <div class="order-card__footer">
          <span class="order-card__total">€ {{ order.total_usd }}</span>
          <a [routerLink]="['/orders', order.id]" class="btn-details">Ver detalhes →</a>
        </div>
      </div>
    </div>

  </div>
</div>
